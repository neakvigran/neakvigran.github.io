
# ============================================================
# SITE CONFIGURATION
# Cybersecurity Writeups | Nutavut Eakvigran
# ============================================================

# Jekyll theme
theme: jekyll-theme-chirpy

# Language and timezone
lang: en
timezone: Asia/Bangkok

# ============================================================
# WEBSITE INFORMATION
# ============================================================

title: "Writeups"

tagline: " Cybersecurity | Offensive Security | Aspiring Penetration Tester "

description: >-
  Personal cybersecurity portfolio featuring penetration
  testing writeups, CTF challenges, security research,
  Active Directory and web application security.

url: "https://neakvigran.github.io"
baseurl: ""

# ============================================================
# AUTHOR AND SOCIAL PROFILES
# ============================================================

github:
  username: neakvigran

twitter:
  username:

social:
  name: Nutavut Eakvigran
  email: neakvigran@gmail.com
  links:
    - https://github.com/neakvigran
    - www.linkedin.com/in/nutavut

# ============================================================
# SEARCH ENGINE VERIFICATION
# ============================================================

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ============================================================
# WEB ANALYTICS
# ============================================================

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# ============================================================
# APPEARANCE
# ============================================================

# Available options: light, dark, or empty
theme_mode: dark

# CDN endpoint (optional)
cdn:

# Sidebar avatar
# Upload avatar.png to assets/img/ before enabling this path.
avatar: "https://avatars.githubusercontent.com/u/270990370?v=4"

# Social preview image
social_preview_image:

# ============================================================
# POSTS AND NAVIGATION
# ============================================================

# Enable table of contents for technical writeups
toc: true

# Number of posts per page
paginate: 10

# Edit post link
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# ============================================================
# COMMENTS
# ============================================================

# Comments are disabled until a provider is configured.
comments:
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# ============================================================
# STATIC ASSETS
# ============================================================

assets:
  self_host:
    enabled:
    env:

# ============================================================
# PROGRESSIVE WEB APP
# ============================================================

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      # - "/example"

# ============================================================
# MARKDOWN AND SYNTAX HIGHLIGHTING
# ============================================================

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# ============================================================
# COLLECTIONS
# ============================================================

collections:
  tabs:
    output: true
    sort_by: order

# ============================================================
# DEFAULT PAGE SETTINGS
# ============================================================

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ============================================================
# STYLING AND HTML COMPRESSION
# ============================================================

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# ============================================================
# EXCLUDED FILES
# ============================================================

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# ============================================================
# CATEGORIES AND TAGS
# ============================================================

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
